<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Project Details · Yousef Tawfiq</title>
    <meta name="description" content="Project details page" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="public/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/project-detail.css" />
  </head>
  <body class="project-detail-page">
    <!-- Navigation -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="container nav-container">
        <a href="/" class="nav-logo" aria-label="Home">YT</a>
        <div class="nav-actions">
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle dark/light mode"
          >
            <i class="fas fa-moon" id="themeIcon"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="container">
      <!-- زر الرجوع - تم إصلاح الهيكل -->
      <div class="project-detail-back">
        <a href="/#projects" class="btn-outline">
          <i class="fas fa-arrow-left"></i>
          <span>Back to Projects</span>
        </a>
      </div>

      <div id="projectDetailContent" class="project-detail-content">
        <p
          style="
            text-align: center;
            color: var(--text-secondary);
            padding: 60px 0;
          "
        >
          Loading project details...
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <div class="container">
        <div class="footer-content">
          <p class="footer-name">
            &copy; <span id="footerYear"></span> Yousef Tawfiq
          </p>
          <p class="footer-tagline">
            Building the future, one line of code at a time.
          </p>
        </div>
      </div>
    </footer>

    <!-- Image Zoom Modal -->
    <div class="image-zoom-overlay" id="imageZoom">
      <button
        class="image-zoom-close"
        id="imageZoomClose"
        aria-label="Close image"
      >
        <i class="fas fa-times"></i>
      </button>
      <img src="" alt="Zoomed image" id="imageZoomImg" />
    </div>

    <script src="js/project-detail.js"></script>
  </body>
</html>
